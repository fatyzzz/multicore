[package]
name = "multicore-daemon"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
async-trait = "0.1"
axum = "0.8"
base64 = "0.22.1"
getrandom = "0.4"
multicore-core = { path = "../multicore-core" }
reqwest = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
tower-http = { version = "0.6", features = ["limit"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
embed-resource = "=3.0.11"
